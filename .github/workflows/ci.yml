# CI pipeline for LoopLab (issue #1).
# Runs on every pull request and every push to main, in four stages:
#   1. quality: lint + typecheck
#   2. test:    unit + integration tests (against a Postgres service) with the 80% coverage gate on src/lib
#   3. build:   production build (uploaded for the E2E stage)
#   4. e2e:     Playwright against the production build
# Security scans (issue #16) run in parallel with the stages: they need nothing and nothing needs them.
#   codeql:            CodeQL static analysis of the JavaScript/TypeScript code (results in the Security tab)
#   audit:             npm audit, failing on high or critical vulnerabilities
#   dependency-review: on pull requests, flags new dependencies with high or critical vulnerabilities
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit and integration tests
    needs: quality
    runs-on: ubuntu-latest
    # Integration tests run against a throwaway Postgres; migrations are applied by
    # tests/integration/global-setup.ts, which also proves they work on an empty database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: looplab
          POSTGRES_PASSWORD: looplab
          POSTGRES_DB: looplab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U looplab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://looplab:looplab@localhost:5432/looplab_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage (src/lib)" >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Metric | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    # Real flows (register, sign in, save) need a database and an Auth.js secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: looplab
          POSTGRES_PASSWORD: looplab
          POSTGRES_DB: looplab_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U looplab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://looplab:looplab@localhost:5432/looplab_e2e
      # Throwaway value for CI only; real secrets live in Vercel's environment settings.
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the repository's Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none # JavaScript/TypeScript is analyzed from source; no build needed
          # The clickable mockup is a design reference that is never served or deployed.
          config: |
            paths-ignore:
              - docs/mockup
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  audit:
    name: "Security: npm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reads package-lock.json, so no install is needed. Exits non-zero on high or critical advisories.
      - run: npm audit --audit-level=high

  dependency-review:
    name: "Security: dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same bar as npm audit: fail when a PR adds a dependency with a high or critical vulnerability.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
